[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-eng"
dynamic = ["version"]
description = "Set up and verify a dual-conductor (Claude Code + Codex) engineering workflow in any Git repository."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "nathanZKL" }]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/nathanZKL/dual-conductor-factory"

[project.scripts]
ai-eng = "ai_eng.cli:entry"

[tool.setuptools.dynamic]
version = { attr = "ai_eng.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_eng = ["templates/**/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
